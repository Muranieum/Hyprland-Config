# See https://wiki.hypr.land/Configuring/Keywords/


$terminal = foot
$fileManager = nautilus
$menu = hyprlauncher
$screenshot = hyprshot -zsm region --clipboard-only
$windowshot = hyprshot -zsm window --clipboard-only
$browser = google-chrome-stable --ozone-platform=wayland -enable-features=UseOzonePlatform --enable-wayland-ime --wayland-text-input-version=3
$btop = foot btop
$nvim = foot nvim
