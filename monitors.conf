# See https://wiki.hypr.land/Configuring/Monitors/

# ultrawide
$ultrawide = desc:Dell Inc. AW3423DWF 55RC2S3
monitorv2 {
    output = $ultrawide
    mode = 3440x1440@165
    position = 0x0
    scale = auto
}


# KG251Q
$kg = desc:Acer Technologies KG251Q T8ZSA0028532
monitorv2 {
    output = $kg
    mode = 1920x1080@144
    position = -1920x360
    scale = auto
}

# catch all
monitor = , preferred, auto, auto
