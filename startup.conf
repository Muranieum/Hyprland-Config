exec-once = [workspace 10 silent] steam & 
exec-once = [workspace 11 silent] discord & 
exec-once = [workspace special:magic silent] google-chrome-stable &
exec-once = ashell & hyprpaper & udiskie &
exec-once = systemctl --user start hyprpolkitagent
exec-once = hyprlauncher -d
exec-once = xhost +si:localuser:root
exec-once = solaar -w hide
exec-once = sleep 2 && fcitx5 -r &

# Watch for text & img copies
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
