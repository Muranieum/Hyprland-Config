# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = SUPER, Q, exec, $terminal
bind = SUPER, W, killactive,
bind = SUPER, C, exec, cliphist list | hyprlauncher -m | cliphist decode | wl-copy
bind = SUPER, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = SUPER, E, exec, $fileManager
bind = SUPER, V, togglefloating,
bind = SUPER, R, exec, $menu
bind = SUPER, J, togglesplit, # dwindle
bind = , Print, exec, $screenshot
bind = SUPER, Print, exec, $windowshot
# bind = SUPER, SPACE, exec, hyprctl  switchxkblayout current next
bind = SUPER, P, exec, $browser
bind = SUPER, B, exec, $btop


# Move focus with mainMod + arrow keys
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Move tiling
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d


bind = ALT , Tab , cyclenext ,
bind = ALT SHIFT , Tab , cyclenext , prev
bind = ALT SHIFT , Tab , bringactivetotop ,
bind = ALT , Tab , bringactivetotop ,

# Move active floating window by 20 pixels
binde = SUPER SHIFT, left,  moveactive, -20 0
binde = SUPER SHIFT, right, moveactive, 20 0
binde = SUPER SHIFT, up,    moveactive, 0 -20
binde = SUPER SHIFT, down,  moveactive, 0 20

binde = SUPER SHIFT ALT, left,  moveactive, -3 0
binde = SUPER SHIFT ALT, right, moveactive, 3 0
binde = SUPER SHIFT ALT, up,    moveactive, 0 -3
binde = SUPER SHIFT ALT, down,  moveactive, 0 3

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
