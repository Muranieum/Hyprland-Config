# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = WIN, Q, exec, $terminal
bind = WIN, W, killactive,
bind = WIN, V, exec, $clipboard
bind = WIN SHIFT, V, exec, $clipboard
bind = WIN, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = WIN, E, exec, $fileManager
bind = WIN, F, togglefloating,
bind = WIN, R, exec, $menu
bind = WIN, J, layoutmsg, togglesplit # dwindle
bind = , Print, exec, $screenshot
bind = WIN, Print, exec, $windowshot
# bind = WIN, SPACE, exec, hyprctl  switchxkblayout current next
bind = WIN, P, exec, $browser
bind = WIN, B, exec, $btop
bind = WIN, N, exec, $nvim


# Move focus with mainMod + arrow keys
bind = WIN, left, movefocus, l
bind = WIN, right, movefocus, r
bind = WIN, up, movefocus, u
bind = WIN, down, movefocus, d

# Move tiling
bind = WIN SHIFT, left, movewindow, l
bind = WIN SHIFT, right, movewindow, r
bind = WIN SHIFT, up, movewindow, u
bind = WIN SHIFT, down, movewindow, d


bind = ALT , Tab , cyclenext ,
bind = ALT SHIFT , Tab , cyclenext , prev
bind = ALT SHIFT , Tab , bringactivetotop ,
bind = ALT , Tab , bringactivetotop ,

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


