# Switch workspaces with mainMod (ALT) + [0-9]
# Move active window to a workspace with mainMod + SHIFT (ALT) + [0-9]
bind = WIN, 1, workspace, 1
bind = WIN, 2, workspace, 2
bind = WIN, 3, workspace, 3
bind = WIN, 4, workspace, 4
bind = WIN, 5, workspace, 5
bind = WIN, 6, workspace, 6
bind = WIN, 7, workspace, 7
bind = WIN, 8, workspace, 8
bind = WIN, 9, workspace, 9
bind = WIN, 0, workspace, 10
bind = WIN ALT, 1, workspace, 11
bind = WIN ALT, 2, workspace, 12
bind = WIN ALT, 3, workspace, 13
bind = WIN ALT, 4, workspace, 14
bind = WIN ALT, 5, workspace, 15
bind = WIN ALT, 6, workspace, 16
bind = WIN ALT, 7, workspace, 17
bind = WIN ALT, 8, workspace, 18
bind = WIN ALT, 9, workspace, 19
bind = WIN ALT, 0, workspace, 20

bind = WIN SHIFT, 1, movetoworkspace, 1
bind = WIN SHIFT, 2, movetoworkspace, 2
bind = WIN SHIFT, 3, movetoworkspace, 3
bind = WIN SHIFT, 4, movetoworkspace, 4
bind = WIN SHIFT, 5, movetoworkspace, 5
bind = WIN SHIFT, 6, movetoworkspace, 6
bind = WIN SHIFT, 7, movetoworkspace, 7
bind = WIN SHIFT, 8, movetoworkspace, 8
bind = WIN SHIFT, 9, movetoworkspace, 9
bind = WIN SHIFT, 0, movetoworkspace, 10
bind = WIN SHIFT ALT, 1, movetoworkspace, 11
bind = WIN SHIFT ALT, 2, movetoworkspace, 12
bind = WIN SHIFT ALT, 3, movetoworkspace, 13
bind = WIN SHIFT ALT, 4, movetoworkspace, 14
bind = WIN SHIFT ALT, 5, movetoworkspace, 15
bind = WIN SHIFT ALT, 6, movetoworkspace, 16
bind = WIN SHIFT ALT, 7, movetoworkspace, 17
bind = WIN SHIFT ALT, 8, movetoworkspace, 18
bind = WIN SHIFT ALT, 9, movetoworkspace, 19
bind = WIN SHIFT ALT, 0, movetoworkspace, 20

bind = WIN, D, workspace, 11
bind = WIN, D, workspace, 1

# Scroll through existing workspaces with mainMod + scroll
bind = CTRL ALT, mouse_down, workspace, e+1
bind = CTRL ALT, mouse_up, workspace, e-1
bind = CTRL ALT, right, workspace, e+1
bind = CTRL ALT, left, workspace, e-1
bind = CTRL ALT, up, workspace, m+1
bind = CTRL ALT, down, workspace, m-1


# Example special workspace (scratchpad)
bind = WIN, S, togglespecialworkspace, bg
bind = WIN SHIFT, S, movetoworkspace, special:bg
bind = WIN, G, togglespecialworkspace, Games
bind = WIN SHIFT, G, movetoworkspace, special:Games

# Move active floating window by 20 pixels
binde = CTRL SHIFT, left,  moveactive, -20 0
binde = CTRL SHIFT, right, moveactive, 20 0
binde = CTRL SHIFT, up,    moveactive, 0 -20
binde = CTRL SHIFT, down,  moveactive, 0 20

binde = CTRL SHIFT ALT, left,  moveactive, -3 0
binde = CTRL SHIFT ALT, right, moveactive, 3 0
binde = CTRL SHIFT ALT, up,    moveactive, 0 -3
binde = CTRL SHIFT ALT, down,  moveactive, 0 3

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = WIN, mouse:272, movewindow
bindm = WIN, mouse:273, resizewindow

# Awakened PoE Trade
bind = CTRL, D, global, :35E249F1A54AE60A3A0ADE816727FD63-Ctrl+D
