windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = move-steamgames

    match:class = ^(steam_app_.*)$
    workspace = special:Games
}

windowrule {
    name = steam-w10

    match:title = Steam
    workspace = 10
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# floating terminal
windowrule {
    name = float-foot
    match:class = foot

    float = yes

    size = 1200 720
    move = ((monitor_w*0.5)-600) ((monitor_h*0.5)-300)
}

windowrule {
    name = float-solar
    match:class = piper

    float = yes
}
